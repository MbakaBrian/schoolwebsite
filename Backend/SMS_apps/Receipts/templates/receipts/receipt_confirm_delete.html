<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete {{ receipt.receipt_id }}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm">

                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">Delete Receipt</h4>
                </div>

                <div class="card-body">

                    <p>
                        Are you sure you want to delete:
                    </p>

                    <h5>
                        {{ receipt.receipt_id }}
                    </h5>

                    <p class="text-muted">
                        Store: {{ receipt.store }}
                    </p>

                    <div class="alert alert-warning">
                        This action will also delete all items
                        belonging to this receipt.
                    </div>

                    <form method="POST">

                        {% csrf_token %}

                        <a
                            href="{% url 'receipt_detail' receipt.receipt_id %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="btn btn-danger"
                        >
                            Yes, Delete Receipt
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
