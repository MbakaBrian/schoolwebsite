<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title }} - School I/O System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">

        <a
            class="navbar-brand"
            href="{% url 'receipt_list' %}"
        >
            School I/O System
        </a>

    </div>
</nav>


<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm">

                <div class="card-header">
                    <h4 class="mb-0">
                        {{ title }}
                    </h4>
                </div>

                <div class="card-body">

                    <form
                        method="POST"
                        enctype="multipart/form-data"
                    >

                        {% csrf_token %}

                        {% if form.non_field_errors %}
                            <div class="alert alert-danger">
                                {{ form.non_field_errors }}
                            </div>
                        {% endif %}


                        {% for field in form %}

                            <div class="mb-3">

                                <label
                                    for="{{ field.id_for_label }}"
                                    class="form-label"
                                >
                                    {{ field.label }}

                                    {% if field.field.required %}
                                        <span class="text-danger">*</span>
                                    {% endif %}

                                </label>

                                {{ field }}

                                {% if field.help_text %}
                                    <div class="form-text">
                                        {{ field.help_text }}
                                    </div>
                                {% endif %}

                                {% for error in field.errors %}
                                    <div class="text-danger small">
                                        {{ error }}
                                    </div>
                                {% endfor %}

                            </div>

                        {% endfor %}


                        <div class="d-flex justify-content-between mt-4">

                            <a
                                href="{% url 'receipt_list' %}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                {% if receipt %}
                                    Update Receipt
                                {% else %}
                                    Save Receipt
                                {% endif %}
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
